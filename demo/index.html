<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#fafafa" />
    <meta name="color-scheme" content="light dark" />
    <!-- ThemeScript と同じ内容。CSS より前に実行して、テーマを最初の描画より前に確定する -->
    <script>
      (()=>{const r=document.documentElement;let c='system';try{const s=localStorage.getItem('u18.theme');if(s==='system'||s==='light'||s==='dark')c=s}catch(e){}const d=c==='dark'||(c==='system'&&matchMedia('(prefers-color-scheme: dark)').matches);r.dataset.theme=d?'dark':'light';r.dataset.themePreference=c;const m=document.querySelector('meta[name="theme-color"]');if(m)m.setAttribute('content',d?'#101010':'#fafafa');if(!matchMedia('(prefers-reduced-motion: reduce)').matches)r.dataset.motion='';if('motion' in r.dataset){try{if(sessionStorage.getItem('u18.hero')!=='1'){sessionStorage.setItem('u18.hero','1');r.dataset.heroPlay=''}}catch(e){}}})()
    </script>
    <title>Under18 Developers UI — 見本</title>
    <meta name="description" content="Under18 Developers のデザインシステムに沿った React コンポーネントの見本です。" />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
